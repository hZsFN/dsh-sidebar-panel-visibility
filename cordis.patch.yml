# ============================================================================
# dsh-sidebar-panel-visibility —— DSH bundle patch
# ============================================================================
# 本文件是插件的「挂载声明」：DSH 启动时按 bundle 层栈叠加各插件 patch，
# 这一条会把插件行插进 profile 的配置树。
#
# 安装方式：
#   dsh plugin --profile desktop add dsh-sidebar-panel-visibility
# 本地开发安装：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-sidebar-panel-visibility
      name: dsh-sidebar-panel-visibility
      config:
        enabled: true
